<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Ocean & Neon Gradients -->
    <linearGradient id="apBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020d18" />
      <stop offset="40%" stop-color="#051c30" />
      <stop offset="80%" stop-color="#0a122c" />
      <stop offset="100%" stop-color="#18072b" />
    </linearGradient>

    <linearGradient id="apPrismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="35%" stop-color="#20e3d2" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ff3388" />
    </linearGradient>

    <linearGradient id="apNeonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="apNeonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3388" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="apCardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 38, 66, 0.75)" />
      <stop offset="100%" stop-color="rgba(8, 20, 38, 0.85)" />
    </linearGradient>

    <radialGradient id="apGlowBall1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#00f5ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="apGlowBall2" cx="70%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ff3388" stop-opacity="0.2" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <filter id="apGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#apBg)" />
  <circle cx="200" cy="140" r="180" fill="url(#apGlowBall1)" />
  <circle cx="650" cy="360" r="220" fill="url(#apGlowBall2)" />

  <!-- Cyber Grid Lines -->
  <g stroke="rgba(0, 245, 255, 0.07)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Main Glass Application Frame -->
  <rect x="50" y="40" width="700" height="400" rx="16" fill="url(#apCardGlass)" stroke="rgba(0, 245, 255, 0.3)" stroke-width="1.5" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.6))" />

  <!-- Window Header Bar -->
  <rect x="50" y="40" width="700" height="44" rx="16" fill="rgba(3, 19, 33, 0.9)" />
  <rect x="50" y="70" width="700" height="14" fill="rgba(3, 19, 33, 0.9)" />
  <line x1="50" y1="84" x2="750" y2="84" stroke="rgba(0, 245, 255, 0.2)" stroke-width="1" />

  <!-- Window Control Dots -->
  <circle cx="78" cy="62" r="6" fill="#ff5f56" />
  <circle cx="98" cy="62" r="6" fill="#ffbd2e" />
  <circle cx="118" cy="62" r="6" fill="#27c93f" />

  <!-- URL Address Bar -->
  <rect x="180" y="52" width="440" height="22" rx="11" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(0, 245, 255, 0.2)" stroke-width="1" />
  <circle cx="196" cy="63" r="3.5" fill="#00f5ff" />
  <text x="210" y="67" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9ab8c8">https://bangkv22.github.io/aqua-prism</text>

  <!-- Left Sidebar Navigation Preview -->
  <rect x="70" y="104" width="130" height="316" rx="10" fill="rgba(2, 14, 26, 0.6)" stroke="rgba(0, 245, 255, 0.15)" stroke-width="1" />
  <text x="86" y="132" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#00f5ff">AQUA<tspan fill="#ff3388">PRISM</tspan></text>
  
  <rect x="82" y="152" width="106" height="26" rx="6" fill="rgba(0, 245, 255, 0.15)" stroke="rgba(0, 245, 255, 0.4)" stroke-width="1" />
  <text x="96" y="169" font-family="'Outfit', sans-serif" font-size="11" font-weight="600" fill="#00f5ff">⚡ Home</text>
  <text x="96" y="200" font-family="'Outfit', sans-serif" font-size="11" fill="#9ab8c8">◇ About</text>
  <text x="96" y="230" font-family="'Outfit', sans-serif" font-size="11" fill="#9ab8c8">✦ Skills</text>
  <text x="96" y="260" font-family="'Outfit', sans-serif" font-size="11" fill="#9ab8c8">◈ Projects</text>
  <text x="96" y="290" font-family="'Outfit', sans-serif" font-size="11" fill="#9ab8c8">✎ Blog</text>
  <text x="96" y="320" font-family="'Outfit', sans-serif" font-size="11" fill="#9ab8c8">✉ Contact</text>

  <!-- Central Showcase Area: 3D Holographic Prism Gem -->
  <g transform="translate(370, 230)" filter="url(#apGlow)">
    <!-- Rotating Halo Rings -->
    <ellipse cx="0" cy="0" rx="90" ry="28" fill="none" stroke="#00f5ff" stroke-width="1.8" opacity="0.6" stroke-dasharray="8 6" />
    <ellipse cx="0" cy="0" rx="110" ry="36" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.5" stroke-dasharray="12 8" />
    
    <!-- Central Octahedron Crystal -->
    <polygon points="0,-70 50,-10 0,60 -50,-10" stroke="#ffffff" stroke-width="1.5" fill="rgba(0, 245, 255, 0.2)" />
    <polygon points="0,-70 50,-10 0,60" fill="url(#apPrismGrad)" opacity="0.75" />
    <polygon points="0,-70 -50,-10 0,60" fill="url(#apNeonCyan)" opacity="0.5" />
    <polygon points="0,60 50,-10 0,15" fill="url(#apNeonPink)" opacity="0.8" />
    
    <!-- Light Burst Lines -->
    <line x1="0" y1="-85" x2="0" y2="75" stroke="#ffffff" stroke-width="1.8" opacity="0.85" />
    <line x1="-70" y1="-5" x2="70" y2="-5" stroke="#ffffff" stroke-width="1.8" opacity="0.85" />
    <circle cx="0" cy="-5" r="8" fill="#ffffff" filter="drop-shadow(0 0 10px #00f5ff)" />
  </g>

  <!-- Right Floating Code & Metric Cards -->
  <!-- Code Snippet Card -->
  <rect x="510" y="104" width="220" height="150" rx="10" fill="rgba(2, 10, 20, 0.85)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.2" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.5))" />
  <rect x="522" y="116" width="60" height="16" rx="4" fill="rgba(168, 85, 247, 0.2)" />
  <text x="528" y="128" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#c084fc">Astro.tsx</text>
  
  <text x="522" y="150" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">const <tspan fill="#f43f5e">theme</tspan> = {</text>
  <text x="532" y="168" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">mode: <tspan fill="#4ade80">'Neon Ocean'</tspan>,</text>
  <text x="532" y="186" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">speed: <tspan fill="#f59e0b">'100/100'</tspan>,</text>
  <text x="532" y="204" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">glass: <tspan fill="#a855f7">true</tspan></text>
  <text x="522" y="224" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">};</text>

  <!-- Metric / Tech Badges Card -->
  <rect x="510" y="270" width="220" height="150" rx="10" fill="rgba(2, 10, 20, 0.85)" stroke="rgba(0, 245, 255, 0.4)" stroke-width="1.2" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.5))" />
  <text x="526" y="296" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#00f5ff">CORE PERFORMANCE</text>
  
  <!-- Score Circle -->
  <circle cx="560" cy="355" r="32" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6" />
  <circle cx="560" cy="355" r="32" fill="none" stroke="#22c55e" stroke-width="6" stroke-dasharray="190 20" stroke-linecap="round" />
  <text x="560" y="361" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#22c55e">100</text>
  
  <text x="610" y="340" font-family="'Outfit', sans-serif" font-size="11" font-weight="600" fill="#ffffff">Lighthouse Score</text>
  <text x="610" y="358" font-family="'Outfit', sans-serif" font-size="10" fill="#4ade80">● Ultra Fast Static</text>
  <text x="610" y="374" font-family="'Outfit', sans-serif" font-size="10" fill="#38bdf8">● Zero JS Overhead</text>

  <!-- Floating Glow Particles -->
  <circle cx="280" cy="370" r="4" fill="#00f5ff" opacity="0.8" filter="drop-shadow(0 0 6px #00f5ff)" />
  <circle cx="470" cy="130" r="5" fill="#ff3388" opacity="0.8" filter="drop-shadow(0 0 8px #ff3388)" />
  <circle cx="230" cy="180" r="3" fill="#a855f7" opacity="0.7" />
  <circle cx="480" cy="390" r="3.5" fill="#20e3d2" opacity="0.8" />
</svg>
