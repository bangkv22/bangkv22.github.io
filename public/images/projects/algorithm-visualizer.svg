<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="avBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020d18" />
      <stop offset="50%" stop-color="#06182c" />
      <stop offset="100%" stop-color="#140728" />
    </linearGradient>

    <linearGradient id="avBarGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#20e3d2" />
    </linearGradient>

    <linearGradient id="avBarActive" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ff3388" />
    </linearGradient>

    <linearGradient id="avBarPivot" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <radialGradient id="avGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#20e3d2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#avBg)" />
  <circle cx="400" cy="240" r="260" fill="url(#avGlow)" />

  <!-- App Window Container -->
  <rect x="50" y="40" width="700" height="400" rx="16" fill="rgba(6, 22, 40, 0.8)" stroke="rgba(32, 227, 210, 0.35)" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="50" y="40" width="700" height="44" rx="16" fill="rgba(3, 14, 26, 0.9)" />
  <rect x="50" y="70" width="700" height="14" fill="rgba(3, 14, 26, 0.9)" />
  <line x1="50" y1="84" x2="750" y2="84" stroke="rgba(32, 227, 210, 0.2)" stroke-width="1" />

  <circle cx="78" cy="62" r="6" fill="#ff5f56" />
  <circle cx="98" cy="62" r="6" fill="#ffbd2e" />
  <circle cx="118" cy="62" r="6" fill="#27c93f" />

  <text x="146" y="66" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#eafbff">
    ALGORITHM VISUALIZER LAB <tspan fill="#20e3d2" font-size="11">[QUICK SORT &amp; DIJKSTRA PATHFINDING]</tspan>
  </text>

  <!-- Left: Sorting Visualizer Bars -->
  <g transform="translate(75, 104)">
    <rect width="380" height="315" rx="12" fill="rgba(2, 10, 20, 0.75)" stroke="rgba(0, 245, 255, 0.2)" stroke-width="1" />
    <text x="16" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#eafbff">Quick Sort Partitioning Frame #184</text>
    <text x="16" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9ab8c8">Time: O(N log N) | Swaps: 42 | Comparisons: 128</text>

    <!-- Legend Row -->
    <circle cx="20" cy="68" r="4" fill="#00f5ff" />
    <text x="30" y="72" font-family="'Outfit', sans-serif" font-size="10" fill="#9ab8c8">Sorted</text>
    <circle cx="90" cy="68" r="4" fill="#ff3388" />
    <text x="100" y="72" font-family="'Outfit', sans-serif" font-size="10" fill="#9ab8c8">Comparing</text>
    <circle cx="180" cy="68" r="4" fill="#f59e0b" />
    <text x="190" y="72" font-family="'Outfit', sans-serif" font-size="10" fill="#9ab8c8">Pivot Point</text>

    <!-- Sorting Bars -->
    <g transform="translate(16, 85)">
      <!-- 1 --> <rect x="0" y="160" width="12" height="50" rx="3" fill="url(#avBarGlow)" />
      <!-- 2 --> <rect x="16" y="140" width="12" height="70" rx="3" fill="url(#avBarGlow)" />
      <!-- 3 --> <rect x="32" y="125" width="12" height="85" rx="3" fill="url(#avBarGlow)" />
      <!-- 4 --> <rect x="48" y="110" width="12" height="100" rx="3" fill="url(#avBarGlow)" />
      <!-- 5 --> <rect x="64" y="95" width="12" height="115" rx="3" fill="url(#avBarGlow)" />
      <!-- 6 --> <rect x="80" y="80" width="12" height="130" rx="3" fill="url(#avBarGlow)" />
      <!-- 7 --> <rect x="96" y="55" width="12" height="155" rx="3" fill="url(#avBarGlow)" />
      <!-- 8 --> <rect x="112" y="40" width="12" height="170" rx="3" fill="url(#avBarGlow)" />
      
      <!-- Currently Comparing Bars (Red/Pink) -->
      <!-- 9 --> <rect x="128" y="20" width="12" height="190" rx="3" fill="url(#avBarActive)" filter="drop-shadow(0 0 6px #ff3388)" />
      <!-- 10 --> <rect x="144" y="60" width="12" height="150" rx="3" fill="url(#avBarActive)" filter="drop-shadow(0 0 6px #ff3388)" />
      
      <!-- 11 --> <rect x="160" y="85" width="12" height="125" rx="3" fill="url(#avBarGlow)" />
      <!-- 12 --> <rect x="176" y="115" width="12" height="95" rx="3" fill="url(#avBarGlow)" />
      
      <!-- Pivot Bar (Amber) -->
      <!-- 13 --> <rect x="192" y="30" width="12" height="180" rx="3" fill="url(#avBarPivot)" filter="drop-shadow(0 0 8px #f59e0b)" />
      
      <!-- Remaining -->
      <!-- 14 --> <rect x="208" y="130" width="12" height="80" rx="3" fill="url(#avBarGlow)" opacity="0.7" />
      <!-- 15 --> <rect x="224" y="100" width="12" height="110" rx="3" fill="url(#avBarGlow)" opacity="0.7" />
      <!-- 16 --> <rect x="240" y="70" width="12" height="140" rx="3" fill="url(#avBarGlow)" opacity="0.7" />
      <!-- 17 --> <rect x="256" y="145" width="12" height="65" rx="3" fill="url(#avBarGlow)" opacity="0.7" />
      <!-- 18 --> <rect x="272" y="120" width="12" height="90" rx="3" fill="url(#avBarGlow)" opacity="0.7" />
      <!-- 19 --> <rect x="288" y="50" width="12" height="160" rx="3" fill="url(#avBarGlow)" opacity="0.7" />
      <!-- 20 --> <rect x="304" y="90" width="12" height="120" rx="3" fill="url(#avBarGlow)" opacity="0.7" />
      <!-- 21 --> <rect x="320" y="170" width="12" height="40" rx="3" fill="url(#avBarGlow)" opacity="0.7" />
      <!-- 22 --> <rect x="336" y="15" width="12" height="195" rx="3" fill="url(#avBarGlow)" opacity="0.7" />
    </g>
  </g>

  <!-- Right: Dijkstra Graph & Shortest Path -->
  <g transform="translate(475, 104)">
    <rect width="250" height="315" rx="12" fill="rgba(2, 10, 20, 0.75)" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1" />
    <text x="18" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#eafbff">Pathfinding Graph</text>
    <text x="18" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c084fc">Dijkstra Shortest Path: 8 Nodes</text>

    <!-- Graph Nodes & Connections -->
    <g transform="translate(18, 65)">
      <!-- Unvisited Edges -->
      <line x1="30" y1="40" x2="110" y2="40" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />
      <line x1="110" y1="40" x2="190" y2="70" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />
      <line x1="30" y1="120" x2="110" y2="120" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />
      <line x1="110" y1="120" x2="190" y2="170" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />

      <!-- Illuminated Shortest Path (Neon Cyan / Gold) -->
      <line x1="30" y1="40" x2="80" y2="90" stroke="#00f5ff" stroke-width="3" filter="drop-shadow(0 0 6px #00f5ff)" />
      <line x1="80" y1="90" x2="150" y2="110" stroke="#00f5ff" stroke-width="3" filter="drop-shadow(0 0 6px #00f5ff)" />
      <line x1="150" y1="110" x2="190" y2="70" stroke="#00f5ff" stroke-width="3" filter="drop-shadow(0 0 6px #00f5ff)" />
      <line x1="190" y1="70" x2="190" y2="170" stroke="#22c55e" stroke-width="3" stroke-dasharray="6 4" />

      <!-- Node A (Start) -->
      <circle cx="30" cy="40" r="14" fill="#00f5ff" filter="drop-shadow(0 0 8px #00f5ff)" />
      <text x="30" y="44" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#031321">A</text>

      <!-- Node B -->
      <circle cx="110" cy="40" r="12" fill="#082038" stroke="#00f5ff" stroke-width="1.5" />
      <text x="110" y="44" font-family="'Outfit', sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">B</text>

      <!-- Node C (Path) -->
      <circle cx="80" cy="90" r="13" fill="#a855f7" filter="drop-shadow(0 0 8px #a855f7)" />
      <text x="80" y="94" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">C</text>

      <!-- Node D (Path) -->
      <circle cx="150" cy="110" r="13" fill="#ec4899" filter="drop-shadow(0 0 8px #ec4899)" />
      <text x="150" y="114" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">D</text>

      <!-- Node E -->
      <circle cx="30" cy="120" r="12" fill="#082038" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
      <text x="30" y="124" font-family="'Outfit', sans-serif" font-size="10" text-anchor="middle" fill="#9ab8c8">E</text>

      <!-- Node Target (G) -->
      <circle cx="190" cy="70" r="15" fill="#f59e0b" filter="drop-shadow(0 0 10px #f59e0b)" />
      <text x="190" y="74" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#031321">G</text>

      <!-- Node H -->
      <circle cx="190" cy="170" r="12" fill="#082038" stroke="#22c55e" stroke-width="1.5" />
      <text x="190" y="174" font-family="'Outfit', sans-serif" font-size="10" text-anchor="middle" fill="#4ade80">H</text>
    </g>
  </g>
</svg>
