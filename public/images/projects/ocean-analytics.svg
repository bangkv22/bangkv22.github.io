<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="oaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020d1a" />
      <stop offset="50%" stop-color="#041b33" />
      <stop offset="100%" stop-color="#081026" />
    </linearGradient>

    <linearGradient id="oaAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="oaAreaPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3388" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="oaBarGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="70%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#20e3d2" />
    </linearGradient>

    <radialGradient id="oaGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="oaGlow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <filter id="oaNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#oaBg)" />
  <circle cx="200" cy="150" r="220" fill="url(#oaGlow1)" />
  <circle cx="680" cy="350" r="240" fill="url(#oaGlow2)" />

  <!-- App Window Frame -->
  <rect x="50" y="40" width="700" height="400" rx="16" fill="rgba(6, 25, 46, 0.75)" stroke="rgba(0, 245, 255, 0.3)" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="50" y="40" width="700" height="44" rx="16" fill="rgba(3, 16, 30, 0.9)" />
  <rect x="50" y="70" width="700" height="14" fill="rgba(3, 16, 30, 0.9)" />
  <line x1="50" y1="84" x2="750" y2="84" stroke="rgba(0, 245, 255, 0.15)" stroke-width="1" />
  
  <circle cx="78" cy="62" r="6" fill="#ff5f56" />
  <circle cx="98" cy="62" r="6" fill="#ffbd2e" />
  <circle cx="118" cy="62" r="6" fill="#27c93f" />

  <text x="146" y="66" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#eafbff">
    OCEAN DATA TELEMETRY &amp; ANALYTICS HUB <tspan fill="#00f5ff" font-size="11">[LIVE v2.4]</tspan>
  </text>

  <!-- Metric Badges Row -->
  <!-- Stat Card 1 -->
  <g transform="translate(75, 104)">
    <rect width="180" height="74" rx="10" fill="rgba(2, 12, 24, 0.7)" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" />
    <text x="16" y="26" font-family="'Outfit', sans-serif" font-size="11" fill="#9ab8c8">SUBSEA SENSOR STREAM</text>
    <text x="16" y="54" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#00f5ff">14,820 <tspan font-size="12" fill="#20e3d2">req/s</tspan></text>
    <circle cx="152" cy="24" r="5" fill="#22c55e" filter="drop-shadow(0 0 6px #22c55e)" />
  </g>

  <!-- Stat Card 2 -->
  <g transform="translate(275, 104)">
    <rect width="180" height="74" rx="10" fill="rgba(2, 12, 24, 0.7)" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1" />
    <text x="16" y="26" font-family="'Outfit', sans-serif" font-size="11" fill="#9ab8c8">DEPTH PRESSURE LEVEL</text>
    <text x="16" y="54" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#c084fc">3,450 <tspan font-size="12" fill="#ff3388">hPa</tspan></text>
    <path d="M140,24 L148,16 L156,24" stroke="#c084fc" stroke-width="2" fill="none" />
  </g>

  <!-- Stat Card 3 -->
  <g transform="translate(475, 104)">
    <rect width="200" height="74" rx="10" fill="rgba(2, 12, 24, 0.7)" stroke="rgba(255, 51, 136, 0.25)" stroke-width="1" />
    <text x="16" y="26" font-family="'Outfit', sans-serif" font-size="11" fill="#9ab8c8">API RESPONSE LATENCY</text>
    <text x="16" y="54" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#ff3388">12.4 <tspan font-size="12" fill="#f59e0b">ms avg</tspan></text>
    <circle cx="174" cy="24" r="5" fill="#00f5ff" filter="drop-shadow(0 0 6px #00f5ff)" />
  </g>

  <!-- Main Telemetry Waveform Chart -->
  <g transform="translate(75, 198)">
    <rect width="420" height="220" rx="12" fill="rgba(2, 12, 24, 0.75)" stroke="rgba(0, 245, 255, 0.2)" stroke-width="1" />
    <text x="20" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#eafbff">Deep Current Waveform &amp; Temperature</text>
    
    <!-- Chart Grid Lines -->
    <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1">
      <line x1="20" y1="60" x2="400" y2="60" />
      <line x1="20" y1="100" x2="400" y2="100" />
      <line x1="20" y1="140" x2="400" y2="140" />
      <line x1="20" y1="180" x2="400" y2="180" />
    </g>

    <!-- Area Chart 1 (Pink Secondary Flow) -->
    <path d="M20,180 Q60,150 110,130 T200,140 T290,110 T360,120 T400,90 L400,190 L20,190 Z" fill="url(#oaAreaPink)" />
    <path d="M20,180 Q60,150 110,130 T200,140 T290,110 T360,120 T400,90" fill="none" stroke="#ff3388" stroke-width="2" />

    <!-- Area Chart 2 (Cyan Primary Waveform) -->
    <path d="M20,190 Q70,120 120,140 T210,80 T300,105 T350,60 T400,75 L400,190 L20,190 Z" fill="url(#oaAreaGrad)" />
    <path d="M20,190 Q70,120 120,140 T210,80 T300,105 T350,60 T400,75" fill="none" stroke="#00f5ff" stroke-width="2.5" filter="url(#oaNeon)" />

    <!-- Highlighted Data Points -->
    <circle cx="210" cy="80" r="5" fill="#ffffff" stroke="#00f5ff" stroke-width="2" />
    <circle cx="350" cy="60" r="5" fill="#ffffff" stroke="#00f5ff" stroke-width="2" />
    <circle cx="290" cy="110" r="4.5" fill="#ffffff" stroke="#ff3388" stroke-width="2" />
  </g>

  <!-- Right Distribution Bars & Node Telemetry -->
  <g transform="translate(515, 198)">
    <rect width="210" height="220" rx="12" fill="rgba(2, 12, 24, 0.75)" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1" />
    <text x="18" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#eafbff">Node Distribution</text>

    <!-- Bars -->
    <!-- Bar 1 -->
    <rect x="25" y="160" width="22" height="40" rx="4" fill="url(#oaBarGrad)" />
    <text x="36" y="152" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#00f5ff">38%</text>
    <text x="36" y="185" font-family="'Outfit', sans-serif" font-size="9" text-anchor="middle" fill="#9ab8c8">N1</text>

    <!-- Bar 2 -->
    <rect x="62" y="125" width="22" height="75" rx="4" fill="url(#oaBarGrad)" />
    <text x="73" y="117" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#00f5ff">65%</text>
    <text x="73" y="185" font-family="'Outfit', sans-serif" font-size="9" text-anchor="middle" fill="#9ab8c8">N2</text>

    <!-- Bar 3 -->
    <rect x="99" y="100" width="22" height="100" rx="4" fill="url(#oaBarGrad)" />
    <text x="110" y="92" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#00f5ff">89%</text>
    <text x="110" y="185" font-family="'Outfit', sans-serif" font-size="9" text-anchor="middle" fill="#9ab8c8">N3</text>

    <!-- Bar 4 -->
    <rect x="136" y="140" width="22" height="60" rx="4" fill="url(#oaBarGrad)" />
    <text x="147" y="132" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#00f5ff">52%</text>
    <text x="147" y="185" font-family="'Outfit', sans-serif" font-size="9" text-anchor="middle" fill="#9ab8c8">N4</text>

    <!-- Bar 5 -->
    <rect x="173" y="110" width="22" height="90" rx="4" fill="url(#oaBarGrad)" />
    <text x="184" y="102" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#00f5ff">78%</text>
    <text x="184" y="185" font-family="'Outfit', sans-serif" font-size="9" text-anchor="middle" fill="#9ab8c8">N5</text>

    <!-- Status Line -->
    <line x1="20" y1="56" x2="190" y2="56" stroke="rgba(255, 255, 255, 0.08)" />
    <circle cx="28" cy="46" r="4" fill="#00f5ff" />
    <text x="40" y="50" font-family="'JetBrains Mono', monospace" font-size="10" fill="#20e3d2">Cluster: Synchronized</text>
  </g>
</svg>
