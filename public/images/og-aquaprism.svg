<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#031321" />
      <stop offset="60%" stop-color="#071E35" />
      <stop offset="100%" stop-color="#020A12" />
    </linearGradient>

    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="35%" stop-color="#20E3D2" />
      <stop offset="70%" stop-color="#9B5CFF" />
      <stop offset="100%" stop-color="#FF5DB1" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#20E3D2" stop-opacity="0.1" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#sunGlow)" />

  <!-- Ambient Bubbles -->
  <circle cx="150" cy="480" r="16" fill="none" stroke="#00F5FF" stroke-width="2" opacity="0.4" />
  <circle cx="280" cy="180" r="24" fill="none" stroke="#9B5CFF" stroke-width="2" opacity="0.35" />
  <circle cx="1020" cy="220" r="18" fill="none" stroke="#20E3D2" stroke-width="2" opacity="0.4" />
  <circle cx="1100" cy="500" r="32" fill="none" stroke="#FF5DB1" stroke-width="2" opacity="0.3" />
  <circle cx="920" cy="440" r="12" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.5" />

  <!-- Central Prism Icon -->
  <g transform="translate(600, 190)" filter="url(#neonBlur)">
    <!-- Outer Octahedron -->
    <polygon points="0,-75 75,-20 0,60 -75,-20" stroke="url(#prismGrad)" stroke-width="4" fill="rgba(3,19,33,0.7)" />
    <!-- Inner Facets -->
    <polygon points="0,-75 0,60 75,-20" fill="url(#prismGrad)" opacity="0.4" />
    <polygon points="0,-75 0,60 -75,-20" fill="url(#prismGrad)" opacity="0.2" />
    <!-- Core Spark -->
    <circle cx="0" cy="-5" r="12" fill="#FFFFFF" />
    <circle cx="0" cy="-5" r="20" fill="#00F5FF" opacity="0.6" />
  </g>

  <!-- Brand Title -->
  <text x="600" y="360" font-family="'Outfit', -apple-system, sans-serif" font-size="64" font-weight="800" text-anchor="middle" fill="#EAFBFF" letter-spacing="4">
    AQUA <tspan fill="url(#prismGrad)">PRISM</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="420" font-family="'Outfit', -apple-system, sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#00F5FF" letter-spacing="3">
    “EXPLORING THE OCEAN OF CODE.”
  </text>

  <!-- Subtitle / Roles -->
  <text x="600" y="480" font-family="'Outfit', -apple-system, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#9AB8C8">
    IT Student • Web Developer • Creative Problem Solver | Bang K.V. Portfolio
  </text>

  <!-- Bottom Accent Line -->
  <rect x="350" y="530" width="500" height="3" rx="1.5" fill="url(#prismGrad)" />
</svg>
